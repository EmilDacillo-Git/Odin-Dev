<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
  </head>
  <body>
    <img src="#" />

    <script>
      const img = document.querySelector("img");
      // API_KEY:  "https://api.giphy.com/v1/gifs/translate?api_key=lQ4Wps95DbqruGir3mSowV3gMjfd2ZyM&s=cats"
      async function getCats() {
        const response = await fetch ("https://api.giphy.com/v1/gifs/translate?api_key=lQ4Wps95DbqruGir3mSowV3gMjfd2ZyM&s=cats", {mode: 'cors'});
        const catData = await response.json();
        img.src = catData.data.images.original.url;

      }

      getCats();
    </script>
  </body>
</html>
